<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Quality of Experience — flat Avataaars style -->
  <rect width="900" height="600" fill="#c5ecd0"/>

  <!-- big screen -->
  <g transform="translate(400 110)">
    <rect x="0" y="0" width="390" height="270" rx="30" fill="#ffffff" stroke="#262e33" stroke-width="10"/>
    <!-- video scene -->
    <circle cx="316" cy="70" r="26" fill="#ffd76e" stroke="#262e33" stroke-width="7"/>
    <path d="M28 226 L 112 122 L 184 226 Z" fill="#58c9b9" stroke="#262e33" stroke-width="7"/>
    <path d="M146 226 L 214 152 L 292 226 Z" fill="#ffdfbf" stroke="#262e33" stroke-width="7"/>
    <rect x="28" y="226" width="334" height="14" rx="7" fill="#b6e3f4"/>
    <!-- buffering spinner -->
    <g transform="translate(70 62)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#b6e3f4" stroke-width="9"/>
      <path d="M0 -22 A 22 22 0 0 1 19 11" fill="none" stroke="#ff9838" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

  <!-- rating stars -->
  <g transform="translate(390 424)">
    <g fill="#ffd76e" stroke="#262e33" stroke-width="7" stroke-linejoin="round">
      <path d="M36 0 L 46 20 L 68 23 L 52 38 L 56 60 L 36 49 L 16 60 L 20 38 L 4 23 L 26 20 Z"/>
      <path d="M124 0 L 134 20 L 156 23 L 140 38 L 144 60 L 124 49 L 104 60 L 108 38 L 92 23 L 114 20 Z"/>
      <path d="M212 0 L 222 20 L 244 23 L 228 38 L 232 60 L 212 49 L 192 60 L 196 38 L 180 23 L 202 20 Z"/>
      <path d="M300 0 L 310 20 L 332 23 L 316 38 L 320 60 L 300 49 L 280 60 L 284 38 L 268 23 L 290 20 Z"/>
    </g>
    <path d="M388 0 L 398 20 L 420 23 L 404 38 L 408 60 L 388 49 L 368 60 L 372 38 L 356 23 L 378 20 Z"
      fill="#ffffff" stroke="#262e33" stroke-width="7" stroke-linejoin="round"/>
  </g>

  <!-- viewer character (Avataaars style) -->
  <g transform="translate(80 130)">
    <!-- chair -->
    <rect x="10" y="250" width="220" height="26" rx="13" fill="#262e33"/>
    <rect x="34" y="276" width="18" height="90" rx="9" fill="#262e33"/>
    <rect x="188" y="276" width="18" height="90" rx="9" fill="#262e33"/>
    <rect x="196" y="120" width="44" height="150" rx="22" fill="#262e33"/>
    <!-- body / shirt -->
    <path d="M52 270 L 52 210 C 52 172 82 150 120 150 C 158 150 188 172 188 210 L 188 270 Z" fill="#ff9838" stroke="#262e33" stroke-width="9"/>
    <!-- neck -->
    <rect x="102" y="118" width="36" height="40" rx="12" fill="#ffdbb4" stroke="#262e33" stroke-width="8"/>
    <!-- head -->
    <circle cx="120" cy="70" r="58" fill="#ffdbb4" stroke="#262e33" stroke-width="9"/>
    <!-- hair -->
    <path d="M62 62 C 58 18 100 2 126 6 C 158 10 180 32 178 62 C 168 44 148 36 120 38 C 92 40 72 48 62 62 Z" fill="#262e33"/>
    <!-- happy eyes -->
    <path d="M92 74 q 9 -14 18 0" stroke="#262e33" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M130 74 q 9 -14 18 0" stroke="#262e33" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- open smile -->
    <path d="M104 92 q 16 16 32 0 z" fill="#262e33"/>
    <!-- arm pointing to screen -->
    <path d="M182 200 Q 250 180 300 190" stroke="#ff9838" stroke-width="20" fill="none" stroke-linecap="round"/>
    <circle cx="308" cy="190" r="15" fill="#ffdbb4" stroke="#262e33" stroke-width="7"/>
  </g>

  <!-- sparkle dots -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="880" cy="80" r="9"/>
    <circle cx="840" cy="130" r="6"/>
    <circle cx="360" cy="70" r="7"/>
  </g>
</svg>
