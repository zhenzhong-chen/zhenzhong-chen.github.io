<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Site title: just change SITE.meta.title in data.js -->
<title>Chen Lab | Wuhan University</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ═══════════ Top bar (affiliation + language links) ═══════════ -->
<div class="topbar">
  <div class="container">
    <span id="topbar-affiliation"></span>
    <span class="topbar-links"><a href="https://jszy.whu.edu.cn/zzchen" target="_blank" rel="noopener">中文</a><a href="#">Internal</a></span>
  </div>
</div>

<!-- ═══════════ Main navigation ═══════════ -->
<header class="nav" id="site-nav">
  <div class="container">
    <a class="brand" href="#home" id="brand"></a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu">☰</button>
    <nav class="menu" id="menu"></nav>
  </div>
</header>

<!-- ═══════════ Hero (CWI-style: full-width image + overlay title) ═══════════ -->
<section class="hero" id="home">
  <div class="hero-media" id="hero-media">
    <!-- Hero photo is set via SITE.hero.image in js/data.js -->
  </div>
  <div class="hero-text container">
    <p class="eyebrow" id="hero-eyebrow"></p>
    <h1 id="hero-title"></h1>
    <p class="lead" id="hero-lead"></p>
    <a class="btn btn-dark" id="hero-cta" href="#projects"></a>
  </div>
</section>

<!-- ═══════════ Project cards (CWI-style: image cards + Read more) ═══════════ -->
<section class="projects" id="projects">
  <div class="container">
    <p class="eyebrow">Research</p>
    <h2 class="sec-title">Featured Projects</h2>
    <div class="project-grid" id="project-grid"></div>
  </div>
</section>

<!-- ═══════════ Latest news ═══════════ -->
<section class="news" id="news">
  <div class="container">
    <div class="sec-row">
      <div>
        <p class="eyebrow">News</p>
        <h2 class="sec-title">Latest News</h2>
      </div>
    </div>
    <div class="news-list" id="news-list"></div>
  </div>
</section>

<!-- ═══════════ Selected publications ═══════════ -->
<section class="pubs" id="pubs">
  <div class="container">
    <div class="sec-row">
      <div>
        <p class="eyebrow">Publications</p>
        <h2 class="sec-title">Selected Publications</h2>
      </div>
      <a class="textlink" href="https://dblp.org/pid/07/954-1.html" target="_blank" rel="noopener">All Publications →</a>
    </div>
    <div id="pub-list"></div>
  </div>
</section>

<!-- ═══════════ Team ═══════════ -->
<section class="team" id="team">
  <div class="container">
    <p class="eyebrow">People</p>
    <h2 class="sec-title">Our Team</h2>
    <div class="director" id="director"></div>
    <p class="sub-title">Ph.D. Students</p>
    <div class="people-grid" id="people-grid"></div>
    <p class="sub-title">Ph.D. Alumni</p>
    <div class="alum-list" id="alum-list"></div>
  </div>
</section>

<!-- ═══════════ Join us + Contact ═══════════ -->
<section class="join" id="join">
  <div class="container join-grid">
    <div>
      <p class="eyebrow">Join us</p>
      <ul class="join-list" id="join-list"></ul>
    </div>
    <div class="join-card">
      <h3>Contact Us</h3>
      <div id="contact-box"></div>
    </div>
  </div>
</section>

<!-- ═══════════ Footer ═══════════ -->
<footer>
  <div class="container footer-grid">
    <div>
      <div class="fbrand" id="fbrand"></div>
      <p id="footer-addr"></p>
    </div>
    <p class="copy" id="footer-copy"></p>
  </div>
</footer>

<button id="toTop" aria-label="Back to top">↑</button>

<!-- Content & scripts: all text is managed centrally in js/data.js -->
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<!-- Dev live-reload: polls content of local files and reloads on change.
     Active ONLY on 127.0.0.1/localhost previews; inert in production. -->
<script>
(function () {
  var h = location.hostname;
  if (h !== "127.0.0.1" && h !== "localhost") return;
  var files = ["", "js/data.js", "js/main.js", "css/style.css"];
  function hash(s) { var x = 5381; for (var i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) | 0; return x; }
  var last = null;
  setInterval(function () {
    Promise.all(files.map(function (f) {
      return fetch(location.pathname.replace(/[^/]*$/, "") + f + (f ? "" : "index.html"), { cache: "no-store" })
        .then(function (r) { return r.text(); }).catch(function () { return ""; });
    })).then(function (texts) {
      var sig = texts.map(hash).join("|");
      if (last !== null && sig !== last) location.reload();
      last = sig;
    }).catch(function () {});
  }, 1500);
})();
</script>
</body>
</html>
