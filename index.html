<!-- Dev live-reload: polls content of local files and reloads on change.
     Active ONLY on 127.0.0.1/localhost previews; inert in production. -->
<script>
(function () {
  var h = location.hostname;
  if (h !== "127.0.0.1" && h !== "localhost") return;
  var files = ["", "js/data.js", "js/main.js", "css/style.css"];
  function hash(s) { var x = 5381; for (var i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) | 0; return x; }
  var last = null;
  setInterval(function () {
    Promise.all(files.map(function (f) {
      return fetch(location.pathname.replace(/[^/]*$/, "") + f + (f ? "" : "index.html"), { cache: "no-store" })
        .then(function (r) { return r.text(); }).catch(function () { return ""; });
    })).then(function (texts) {
      var sig = texts.map(hash).join("|");
      if (last !== null && sig !== last) location.reload();
      last = sig;
    }).catch(function () {});
  }, 1500);
})();
</script>
